imports:
  - { resource: ./vendor/openeuropa/code-review/dist/base-conventions.yml }

grumphp:

  environment:
    variables:
      # Read by dist/phpstan.drupal.project.php, so that both PHPStan tasks run
      # the project's PHPStan configuration.
      OPENEUROPA_PHPSTAN_CONFIGURATION: '%tasks.phpstan.configuration%'

  tasks:

    # PHP Code Sniffer.
    phpcs:
      standard: '%tasks.phpcs.standard%'
      ignore_patterns: '%tasks.phpcs.ignore_patterns%'
      triggered_by: '%tasks.phpcs.triggered_by%'
      whitelist_patterns: '%tasks.phpcs.whitelist_patterns%'
      warning_severity: '%tasks.phpcs.warning_severity%'
      exclude:
        - 'Drupal.Commenting.Deprecated'
      metadata:
        priority: 300

    # PHP Stan, everything except deprecations.
    phpstan:
      autoload_file: '%tasks.phpstan.autoload_file%'
      configuration: ./vendor/openeuropa/code-review-drupal/dist/phpstan.drupal.without-deprecations.neon
      level: '%tasks.phpstan.level%'
      force_patterns: '%tasks.phpstan.force_patterns%'
      ignore_patterns: '%tasks.phpstan.ignore_patterns%'
      triggered_by: '%tasks.phpstan.triggered_by%'
      memory_limit: "-1"
      use_grumphp_paths: true

    # PHP Stan, deprecations only. Non-blocking by default: deprecations are
    # reported as warnings without failing the run.
    phpstan_deprecations:
      autoload_file: '%tasks.phpstan.autoload_file%'
      configuration: ./vendor/openeuropa/code-review-drupal/dist/phpstan.drupal.deprecations-only.neon
      level: '%tasks.phpstan.level%'
      force_patterns: '%tasks.phpstan.force_patterns%'
      ignore_patterns: '%tasks.phpstan.ignore_patterns%'
      triggered_by: '%tasks.phpstan.triggered_by%'
      memory_limit: "-1"
      use_grumphp_paths: true
      metadata:
        task: phpstan
        blocking: '%tasks.phpstan_deprecations.blocking%'

    # Commit message format.
    git_commit_message:
      matchers: '%tasks.git_commit_message.matchers%'
      case_insensitive: false
      enforce_no_subject_trailing_period: false
      multiline: false
      max_body_width: 0
      max_subject_width: 0

parameters:
  drupal-conventions.triggered_by:
    - php
    - module
    - inc
    - theme
  tasks.phpcs.standard: ./vendor/drupal/coder/coder_sniffer/Drupal
  tasks.phpcs.triggered_by: '%drupal-conventions.triggered_by%'
  tasks.phpstan.triggered_by: '%drupal-conventions.triggered_by%'
  tasks.phpstan.configuration: ./vendor/openeuropa/code-review-drupal/dist/phpstan.drupal.neon
  tasks.phpstan_deprecations.blocking: false
